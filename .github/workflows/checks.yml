name: checks

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the tree.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved, a SHA cannot.
      # The version in the comment is what that SHA is; bump both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: naming
        run: node tools/ts/lint-naming/lint-naming.mjs
      - name: data
        run: node tools/ts/validate-data/validate-data.mjs
      - name: extraction is reproducible
        run: |
          python3 tools/py/extract-from-html.py
          git diff --exit-code -- data/dist
